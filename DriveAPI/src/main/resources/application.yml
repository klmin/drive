# 공통 설정 — 서버(운영·설치본·쿠버네티스) 기준값. 프로필 없이 뜨고, 서버마다 다른 값은 환경변수로 주입한다.
# 기본값 없는 ${...}(DB·프론트 주소 등)는 주입하지 않으면 기동에 실패한다.
# 로컬은 DriveAPI/.env(DriveAPI/.env.example 복사)가 덮는다 — yml 은 import 하지 않고, 실행 구성(.run/DriveAPI.run.xml)의 VM 옵션이 읽는다. 테스트는 application-test.yml(test 프로필).
spring:
  datasource:
    url: jdbc:postgresql://${DRIVE_DATABASE_HOST}:${DRIVE_DATABASE_PORT}/${DRIVE_DATABASE_NAME}${DRIVE_DATABASE_OPTIONS:}
    username: ${DRIVE_DATABASE_USERNAME}
    password: ${DRIVE_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
  jackson:
    time-zone: ${drive.time-zone}
  # @Scheduled 실행 스레드 수 — 기본 1 이면 오래 걸리는 작업(삭제 대기열·휴지통 정리·라이선스 인증)이 다른 작업(매분 잠금 정리 등)을 밀어낸다.
  #   오래 걸리는 작업 2 + 짧은 작업 1 + 여유 1. 같은 작업의 중복 실행은 스레드 수와 무관하게 없다(이전 실행 종료 후 다음 예약, WAS 간은 ShedLock).
  task:
    scheduling:
      pool:
        size: 4
  # Flyway — 기동 시 스키마·기초 데이터 마이그레이션. 정본 = classpath:db/migration (V1__init.sql = 구 DriveInstaller initialize.sql)
  #   DB·계정·권한은 Flyway 가 만들지 않는다(설치기·DBA 가 먼저 만든다).
  #   빈 DB 는 V1 부터 실행, 이력(flyway_schema_history)이 있는 DB 는 남은 V 만 실행한다.
  #   테이블은 있는데 이력이 없는 DB(예전 initialize.sql 로 만든 DB):
  #     DRIVE_FLYWAY_BASELINE_ON_MIGRATE=false(기본) → 기동 실패(설치 잔재 등 애매한 DB 를 조용히 넘기지 않는다)
  #     DRIVE_FLYWAY_BASELINE_ON_MIGRATE=true        → V1 을 실행하지 않고 "V1 적용됨"(baseline)만 기록한 뒤 V2 부터 적용.
  #       스키마가 V1 과 같은지는 검사하지 않으므로 맞춰 둔 DB 에만 켠다. baseline 이 한 번 기록되면 이 값은 더는 의미 없다.
  #   적용 이력 = DB 의 flyway_schema_history. 이미 적용된 V 파일은 고치지 않는다(checksum 불일치로 기동 실패) — 변경은 새 V 파일로.
  flyway:
    enabled: ${DRIVE_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${DRIVE_FLYWAY_BASELINE_ON_MIGRATE:false}
    # baseline 할 때만 쓰인다(= 기존 DB 를 V1 상태로 인정). Flyway 기본값도 1 이지만 의도를 드러내려고 적는다
    baseline-version: 1
    validate-on-migrate: true
    # 이메일 템플릿 본문의 ${resourceName} 같은 문자열을 Flyway placeholder 로 치환하지 않는다
    placeholder-replacement: false
  # JPA(Hibernate). DDL 은 Flyway(db/migration)가 관리(자동 생성 금지), OSIV 끔, SQL 로그는 log4j2 로.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
        timezone:
          default_storage: NORMALIZE_UTC
  # jOOQ — DataSource 메타데이터 추정(p6spy 래핑) 대신 방언 고정. 운영 DB = PostgreSQL
  jooq:
    sql-dialect: postgres

  ai:
    mcp:
      server:
        name: drive-mcp
        version: 1.0.0
        protocol: STATELESS
        streamable-http:
          mcp-endpoint: /mcp
        capabilities:
          tool: true

  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1

  # OAuth2 AS 세션(authorize~코드발급 구간) 저장소 — JDBC(SPRING_SESSION 테이블)로
  # 멀티 WAS에서도 세션 공유. 테이블은 자동 생성하지 않음(initialize.sql에 DDL 포함,
  # 다른 SAS 테이블과 동일 방침). /api·/mcp는 기존대로 STATELESS — 영향 없음.
  session:
    jdbc:
      initialize-schema: never
    timeout: 30m

  # Redis(선택 구성요소) 연결 — drive.redis.enabled=true 일 때만 쓴다. 꺼져 있으면 연결하지 않는다(Lettuce 는 처음 쓸 때 연결).
  #   timeout 은 짧게 — Redis 가 느리거나 죽었을 때 요청이 오래 붙잡히지 않고 각 기능의 장애 시 동작(DB·통과)으로 빨리 넘어가게
  data:
    redis:
      host: ${DRIVE_REDIS_HOST:localhost}
      port: ${DRIVE_REDIS_PORT:6379}
      password: ${DRIVE_REDIS_PASSWORD:}
      database: ${DRIVE_REDIS_DATABASE:0}
      ssl:
        enabled: ${DRIVE_REDIS_SSL_ENABLED:false}
      timeout: ${DRIVE_REDIS_TIMEOUT:500ms}
      connect-timeout: ${DRIVE_REDIS_CONNECT_TIMEOUT:1s}
      # @RedisHash 저장소는 쓰지 않는다 — JPA 저장소와 섞여 기동 로그에 경고가 나지 않게 끈다
      repositories:
        enabled: false

  mvc:
    async:
      # MVC 비동기 응답 시간 제한 — 이 앱에서 비동기 응답은 StreamingResponseBody 다운로드뿐이다(StreamingAsyncConfig).
      # 다운로드는 크기·회선에 따라 얼마든지 길어지므로 제한하지 않는다(-1). 값을 두면 그 시간에 전송이 끊기는데,
      # Tomcat 비동기 타임아웃은 이미 보내기 시작한 응답의 연결을 닫지 못해 클라이언트가 받다 만 채로 멈춘다.
      # 멈춘 클라이언트는 Tomcat 쓰기 타임아웃이 끊고, 동시 전송 수는 drive.download.stream.max-threads 가 막는다
      request-timeout: -1
  web:
    resources:
      # StaticResourceConfig에서 /** 경로를 직접 처리하므로
      # 기본 정적 리소스 핸들러와의 중복 매핑을 방지하기 위해 비활성화
      add-mappings: false

# 서버 로그(콘솔 + info/error 파일). 경로는 LOG_PATH·ERROR_LOG_PATH. 로컬은 .env 에서 log4j2-local.yml(콘솔 전용)로 바꾼다
logging:
  config: classpath:log/log4j2-server.yml

# 관측성(리포 observability/ 의 Alloy·Prometheus·Loki·Tempo·Grafana)
#   메트릭: Alloy 가 관리 포트의 /actuator/prometheus 를 가져간다(pull). 관리 포트는 서비스 포트와 분리 — 외부에 열지 않는다
#   트레이스: 앱이 OTLP 로 Alloy 에 보낸다(push). 기본 꺼짐 — 관측성 스택이 있는 곳만 DRIVE_OTLP_TRACING_EXPORT_ENABLED=true
#   로그: 로그 파일에 [traceId,spanId] 가 찍히고(log4j2 패턴), Alloy 가 파일을 읽는다. 전송을 꺼도 traceId 는 찍힌다
management:
  server:
    port: ${DRIVE_MANAGEMENT_PORT:8091}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    # Redis 를 켠 설치처도 끈다 — 켜면 Redis 장애 때 health 가 DOWN 이 되어 LB·k8s 가 WAS 를 빼 버린다(Redis 는 선택 구성요소, 장애가 전체 장애가 되면 안 됨).
    #   연결 상태는 지표 drive_redis_up(RedisConnectionMonitor)으로 본다
    redis:
      enabled: false
  metrics:
    tags:
      application: drive-api
    distribution:
      # 응답 시간 분포(histogram) — Grafana 에서 p95·p99 계산, 점(exemplar)에서 트레이스로 이동
      percentiles-histogram:
        http.server.requests: true
        # S3 호출(S3ObservationInterceptor) — operation 별 p95. Timer 기본 범위(1ms~30초)를 넘는 큰 파트 업로드가 있어 2분까지 늘린다
        aws.s3.client: true
      minimum-expected-value:
        aws.s3.client: 1ms
      maximum-expected-value:
        aws.s3.client: 2m
      # SLO 경계 — 기본 히스토그램 구간에는 1초가 없어(가장 가까운 0.984초) "1초 안에 끝난 비율" 을 정확히 셀 수 없다.
      #   le="0.3"·le="1.0"·le="3.0" 구간을 더한다(Grafana SLO 패널·알림 drive-slo-*)
      slo:
        http.server.requests: 300ms,1s,3s
  observations:
    enable:
      # Spring Security 필터 체인 구간(인증·인가 단계별 span) — 요청마다 여러 개라 트레이스를 가리고,
      #   web.ignoring 경로는 "unsecured request" 루트 트레이스를 따로 만든다. 끈다(ObservationConfig 참고)
      spring.security: false
  tracing:
    sampling:
      # 앱이 트레이스를 만들어 보낼 요청 비율(0.0~1.0). 기본 1.0 = 전부 보내고, 남길지는 Alloy 가 정한다(tail 샘플링:
      #   에러·느린 요청은 전부, 나머지는 일부 — observability/alloy/config.alloy). 앱에서 낮추면 에러 트레이스도 같이 버려진다
      probability: ${DRIVE_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${DRIVE_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${DRIVE_OTLP_TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.name: drive-api
      deployment.environment: ${DRIVE_ENV:local}

# p6spy SQL 로그 — 기본 끔, 로컬은 .env 에서 켠다
decorator:
  datasource:
    enabled: false

# TFO HTTP Storage — 티켓 최초 열기 마감·Drive 문서 세션 수명(원격 09dee78c9 의 application-common.yml 에서 옮김)
tfo:
  storage:
    open-ttl: ${TFO_TICKET_OPEN_TTL:60s}
    session-ttl: ${TFO_STORAGE_SESSION_TTL:24h}

# Swagger
springdoc:
  swagger-ui:
    enabled: true
    groups-order: ASC
    urls-primary-name: drive
    tags-sorter: alpha
    operations-sorter: method
    disable-swagger-default-url: true
    display-request-duration: true
    defaultModelsExpandDepth: 2
    defaultModelExpandDepth: 2
  api-docs:
    enabled: true
    path: /api-docs
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  writer-with-default-pretty-printer: true
  model-and-view-allowed: true

storage:
  type: ${DRIVE_STORAGE_TYPE:}
  connection:
    endpoint: ${DRIVE_STORAGE_ENDPOINT:}
    region: ${DRIVE_STORAGE_REGION:}
    access-key: ${DRIVE_STORAGE_ACCESS_KEY:}
    secret-key: ${DRIVE_STORAGE_SECRET_KEY:}
    bucket-name: ${DRIVE_STORAGE_BUCKET_NAME:}
  # S3 동기 클라이언트(업로드·다운로드·삭제)의 HTTP 커넥션 풀 — S3HttpClientProperty.
  #   동기 SDK 는 커넥션 풀만 있다: 다운로드 1건은 전송 끝까지, 업로드 파트 1건은 파트 전송 동안 연결 1개를 점유한다.
  #   동시 수 제한은 입구(drive.download.stream.max-threads, 기본 100)에서 하고 이 풀은 그보다 크게 잡은 안전망이다 — 두 값은 항상 같이 정한다.
  #   권장: 다운로드 상한 + 업로드 본문 상한(drive.upload.max-concurrent-bodies, 기본 50) + 제어용(complete·삭제·head, 약 20) 이상.
  #   풀은 WAS 인스턴스마다 따로라 스토리지가 받는 연결 수는 max-connections × WAS 대수.
  #   연결을 못 빌리면 connection-acquisition-timeout 뒤 재시도 없이 503(STORAGE_009). 지표 drive_s3_http_*
  http:
    # 다운로드 스트림 100 + 업로드 파트 50 + 제어용 20 = 170 에 여유 (SDK 기본 50)
    max-connections: ${DRIVE_STORAGE_HTTP_MAX_CONNECTIONS:200}
    # SDK 기본 10s × 재시도 3회 → 막히면 빨리 실패
    connection-acquisition-timeout: ${DRIVE_STORAGE_HTTP_ACQUISITION_TIMEOUT:2s}
    connection-timeout: ${DRIVE_STORAGE_HTTP_CONNECTION_TIMEOUT:2s}
    socket-timeout: ${DRIVE_STORAGE_HTTP_SOCKET_TIMEOUT:30s}
    tcp-keep-alive: true
  admin:
    url: ${DRIVE_STORAGE_ADMIN_URL:}
    username: ${DRIVE_STORAGE_ADMIN_USERNAME:}
    password: ${DRIVE_STORAGE_ADMIN_PASSWORD:}
    refresh-threshold: 1m

app:
  front:
    base-url: ${DRIVE_FRONT_BASE_URL:}
    login-path: /login

share:
  context-path: ${DRIVE_SHARE_CONTEXT_PATH:/s/}

csv:
  upload:
    admin-max-size: 5MB

resource:
  versions:
    limit: 99

# MCP 파일 내용 상한 (drive_read_file / drive_download_file / drive_upload_file) — LLM 컨텍스트 보호 및 서버 안전판.
# 읽기·다운로드 기본값은 구글 드라이브 커넥터 실측 동형(다운로드 10MB 하드 리밋). FileContentProperty 참조
file:
  content:
    read-max-size: ${DRIVE_FILE_CONTENT_READ_MAX_SIZE:10MB}
    read-max-chars: ${DRIVE_FILE_CONTENT_READ_MAX_CHARS:50000}
    download-max-size: ${DRIVE_FILE_CONTENT_DOWNLOAD_MAX_SIZE:10MB}
    write-max-size: ${DRIVE_FILE_CONTENT_WRITE_MAX_SIZE:512KB}   # drive_upload_file 내용 상한(디코딩 후 바이트) — 모델 출력 한계와 같은 선의 안전판
    charset-confidence-threshold: ${DRIVE_FILE_CONTENT_CHARSET_CONFIDENCE_THRESHOLD:80}  # 평문 인코딩 감지(ICU) 신뢰도 문턱 — 미만이면 MS949 기본값

server:
  forward-headers-strategy: native
  tomcat:
    # 연결 뒤 요청 줄을 기다리는 시간이자 본문 읽기 한 번의 대기 상한(소켓 읽기 타임아웃) — 바이트를 멈춘 연결이 업로드 허가·스레드를 잡고 있지 않게.
    # 읽기 한 번 기준이라 느린 회선이라도 바이트가 오는 동안은 끊지 않는다. 조금씩 흘려 보내는 연결은 앞단 Apache mod_reqtimeout(최소 속도)이 막는다. keep-alive 유휴 연결도 이 시간 뒤 닫힘
    connection-timeout: ${DRIVE_TOMCAT_CONNECTION_TIMEOUT:20s}
    # Tomcat 요청 스레드 지표(tomcat_threads_busy/current/config_max) — 기본은 꺼져 있다. CPU 여유가 있는데 처리량이 안 오를 때 스레드 고갈인지 가린다
    mbeanregistry:
      enabled: true
    accesslog:
      enabled: ${DRIVE_WEB_LOG_ENABLED:true}
      directory: ${DRIVE_WEB_LOG_DIRECTORY:/log/drive/web}
      prefix: drive_access
      suffix: .log
      pattern: ${DRIVE_WEB_LOG_PATTERN:[%{yyyy-MM-dd HH:mm:ss}t] | [%I] | %h | "%r" | %s | %b | %{ms}Tms | %{s}Tsec | "%{Referer}i" | "%{User-Agent}i"}
      rotate: true
      rename-on-rotate: true
      request-attributes-enabled: true
      max-days: ${DRIVE_WEB_LOG_MAX_DAYS:14}
      check-exists: true

# 쿠키로 인증하는 내부 API 를 다른 origin 에서 부를 수 있게 할 목록(쉼표 구분). 같은 origin 배포는 비워 둠.
# 외부 API·MCP 는 API Key·OAuth 토큰이라 이 목록과 무관하게 모든 origin 허용(CorsConfigSourceFactory)
cors:
  allowed-origins: ${DRIVE_CORS_ALLOWED_ORIGINS:}

# Drive 를 iframe 으로 넣을 수 있는 origin(developers 등, 쉼표 구분) — frame-ancestors. 비우면 같은 origin 만 허용
embed:
  allowed-origins: ${DRIVE_EMBED_ALLOWED_ORIGINS:*}

# 로그인 토큰 서명 키·만료(JwtProperty). 쿠키 Max-Age 에도 같은 만료를 쓴다. 키는 환경변수로 주입(설치처마다 다른 값 권장)
jwt:
  secret:
    key: ${DRIVE_JWT_SECRET_KEY}
  accessExp: 1h
  refreshExp: 7d

# auth token expiry
auth:
  token:
    password-reset-expiry: 1h
    tenant-access-expiry: 5m
  # 로그인 토큰 쿠키(AuthCookieProperty). Max-Age 는 jwt.accessExp·refreshExp(JwtProperty), HttpOnly·Domain 은 코드에서 고정
  cookie:
    secure: ${DRIVE_AUTH_COOKIE_SECURE:false}        # 기본 false(HTTP 서비스 기준). HTTPS 로 서비스하는 곳(앞단 TLS 프록시 등)은 true 주입
    same-site: ${DRIVE_AUTH_COOKIE_SAME_SITE:Lax}  # FE·BE 를 서로 다른 사이트로 배포하면 None(+secure)

# OAuth2 AS(MCP 연동) 발급 토큰 수명 — DCR 등록 시 클라이언트 행(TokenSettings)에 저장됨.
# 변경해도 이미 등록된 클라이언트에는 소급되지 않는다 (OAuth2TokenProperty 참조)
oauth2:
  token:
    access-token-ttl: 1h
    refresh-token-ttl: 30d
  # 익명 DCR(/connect/register) 남용 방지 (OAuth2RegistrationProperty). 초과 시 429
  registration:
    per-ip-limit: ${DRIVE_OAUTH2_REGISTRATION_PER_IP_LIMIT:10}    # IP 하나가 window 안에 등록할 수 있는 수(Redis 켜면 WAS 합산, 끄면 WAS 별)
    global-limit: ${DRIVE_OAUTH2_REGISTRATION_GLOBAL_LIMIT:500}   # window 안 전체 등록 수(DB 기준)
    window: 1h
    unused-ttl: 7d   # 인가·연결 이력이 없는 등록 클라이언트를 정리하기까지의 유예

# SMTP 비밀번호 DB 암호화 키(SmtpPasswordEncryptor). 바꾸면 저장된 SMTP 비밀번호를 못 푼다 — 기존 설치처는 원래 값 유지
smtp:
  aes:
    secret:
      key: ${DRIVE_SMTP_AES_SECRET_KEY}

drive:
  # Redis 사용 스위치(DriveRedisProperty) — 기본 끔. 켜면 Redis 를 쓰는 기능(캐시 무효화·JWT 블랙리스트·rate limit)이 Redis 구현으로 바뀐다.
  #   연결 정보는 위 spring.data.redis(DRIVE_REDIS_HOST 등). Redis 는 maxmemory-policy noeviction 으로 둔다(docs/design/scaling-strategy.md §3-2)
  redis:
    enabled: ${DRIVE_REDIS_ENABLED:false}
    # 여러 설치가 Redis 하나를 같이 쓸 때 키가 섞이지 않게 설치마다 다르게
    key-prefix: ${DRIVE_REDIS_KEY_PREFIX:drive:}
  # 로그인 전 화면 요청 수 제한(RateLimitProperty, 분당) — 넘으면 429 + Retry-After. Redis 를 켜면 WAS 끼리 합산, 아니면 WAS 마다
  rate-limit:
    enabled: ${DRIVE_RATE_LIMIT_ENABLED:true}
    login-per-account: ${DRIVE_RATE_LIMIT_LOGIN_PER_ACCOUNT:10}
    login-per-ip: ${DRIVE_RATE_LIMIT_LOGIN_PER_IP:100}
    anonymous-login-per-ip: ${DRIVE_RATE_LIMIT_ANONYMOUS_LOGIN_PER_IP:30}
  # 시간대 — 요청 날짜 해석·년월일 검색 경계·응답 시각 표시의 기준(JVM 기본 시간대는 쓰지 않는다). 설치처에서 DRIVE_TIME_ZONE 으로 변경
  time-zone: ${DRIVE_TIME_ZONE:Asia/Seoul}
  license:
    # 라이선스 검사 — false 면 사용자 로그인 차단이 풀린다(라이선스 파일 없는 로컬 개발 전용, 운영은 반드시 true). LicenseEnforcementProperty
    enforcement-enabled: ${DRIVE_LICENSE_ENFORCEMENT_ENABLED:true}
  super-admin:
    allowed-ips: ${DRIVE_SUPER_ADMIN_ALLOWED_IPS:}
    external:
      static-api-key: ${DRIVE_SUPER_ADMIN_EXTERNAL_API_KEY:}
  scheduler:
    batch:
      # 공유 DB 배치 스케줄러(@ConditionalOnBatchScheduler) — k8s 에서 배치 담당 Deployment 만 true
      enabled: ${DRIVE_SCHEDULER_BATCH_ENABLED:true}
  rest-client:
    # 외부 호출 요청·응답 본문까지 로그(본문 버퍼링) — 운영 false, dev·로컬은 true 주입
    trace-enabled: ${DRIVE_REST_CLIENT_TRACE_ENABLED:false}
  # 테넌트 관리자가 입력한 주소(OIDC issuer·JWT JWKS·SMTP host)로 나가는 요청의 내부망 가드(SSRF 방지).
  #   공인 IP 는 항상 통과. 169.254.0.0/16(클라우드 메타데이터)·fe80::/10 은 설정과 상관없이 항상 차단, OIDC·JWKS 는 리다이렉트를 따라가지 않는다.
  #   enabled=true 면 loopback·사설망(10/8·172.16/12·192.168/16)·100.64/10·fc00::/7 도 차단 — 여러 고객사가 한 서버를 쓰는 배포는 켠다.
  #   사내 IdP·메일 서버를 쓰는 설치처는 그 대역을 allowed-cidrs 에 쉼표로 넣는다(예: 10.20.0.0/16,192.168.10.5/32).
  outbound-guard:
    enabled: ${DRIVE_OUTBOUND_GUARD_ENABLED:false}
    allowed-cidrs: ${DRIVE_OUTBOUND_GUARD_ALLOWED_CIDRS:}
  # 다운로드 본문 전송 스레드 풀(StreamingAsyncConfig) — 상한 = 동시 다운로드 수, 넘치면 바로 503.
  #   정하는 기준: WAS 회선 대역폭 ÷ 1인당 최소 속도(스토리지 읽기 속도가 더 낮으면 그 기준). 1Gbps(약 125MB/s)·1인당 1MB/s → 약 100.
  #   스레드는 대부분 I/O 대기라 CPU 코어 수와는 관계가 약하다. 바꾸면 storage.http.max-connections 도 같이 정한다(상한 + 70 이상)
  download:
    stream:
      core-threads: ${DRIVE_DOWNLOAD_STREAM_CORE_THREADS:8}
      max-threads: ${DRIVE_DOWNLOAD_STREAM_MAX_THREADS:100}
  # 업로드 본문(청크 파트 PUT·단일 업로드 POST /files) 동시 상한(UploadConcurrencyLimitFilter) — WAS 마다 따로, 넘치면 본문을 읽기 전에 503 + Retry-After.
  #   업로드가 Tomcat 요청 스레드(200)를 다 쓰지 못하게 막는다. 바꾸면 storage.http.max-connections 도 같이 정한다(다운로드 상한 + 이 값 + 20 이상)
  upload:
    max-concurrent-bodies: ${DRIVE_UPLOAD_MAX_CONCURRENT_BODIES:50}
  # 설치 직후 초기 설정(InitialSetupRunner) — Flyway 뒤 기동 시, 값이 주입됐고 DB 에 아직 없을 때만 넣는다(이미 있으면 유지).
  # 대상 테넌트 = 활성 자체관리(SELF_MANAGED) 테넌트가 하나뿐일 때 그 테넌트(첫 설치면 1). 여러 개면 건너뛴다.
  initial-setup:
    # 라이선스 파일(.tfl) 경로 — 대상 테넌트에 라이선스가 없을 때만 업로드 API 와 같은 검증으로 등록.
    #   검증용 공개키는 라이선스 라이브러리가 ~/weboffice/license/thinkfree.public.key(또는 $WEBOFFICE_HOME/license/) 에서 읽는다.
    license-file: ${DRIVE_INITIAL_LICENSE_FILE:}
    # office(TFO) 연결 — 대상 테넌트에 office 설정이 없을 때만, 관리자 화면과 같은 검증을 통과하면 통째로 저장(하나라도 빠지면 저장 안 함)
    office:
      domain: ${DRIVE_INITIAL_OFFICE_DOMAIN:}
      adapter-name: ${DRIVE_INITIAL_OFFICE_ADAPTER_NAME:}
      auth-mode: ${DRIVE_INITIAL_OFFICE_AUTH_MODE:ticket}
      # 연결 방식(onPremise | none) — 허용값 검증·저장 규칙은 관리자 화면 저장과 같다
      connection-type: ${DRIVE_INITIAL_OFFICE_CONNECTION_TYPE:onPremise}
      ticket-service-token: ${DRIVE_INITIAL_OFFICE_TICKET_SERVICE_TOKEN:}
      http-storage-request-jwt-secret: ${DRIVE_INITIAL_OFFICE_HTTP_STORAGE_REQUEST_JWT_SECRET:}

tenant:
  cache-ttl-seconds: 30
  cache-max-size: 1000
  dev-fallback-enabled: ${DRIVE_TENANT_DEV_FALLBACK_ENABLED:false}   # dev 서버는 true 주입(운영은 반드시 false)
  dev-default-tenant-seq: 1
  resolution-mode: PATH

# 감사 로그 → Governance 서버 전송 (TFDRIVE-1612). 기본 ON — 아래 SDK 값을 모두 환경변수로 주입해야 뜬다(없으면 기동 실패). 쓰지 않는 설치처는 GOVERNANCE_AUDIT_ENABLED=false
# HMAC 시크릿(base64-secret)을 기본값으로 두면 git 이력에 남는다(ceph/s3 키와 동일 성격).
governance:
  audit:
    enabled: ${GOVERNANCE_AUDIT_ENABLED:true}
  origin:
    # 감사 로그 origin.instanceId — 이 설치 인스턴스를 구분하는 이름. 서버마다 설치처 이름 주입 권장(로컬 .env 는 tfd-local)
    instance-id: ${GOVERNANCE_ORIGIN_INSTANCE_ID:tfd}
  sdk:
    endpoint: ${GOVERNANCE_SDK_ENDPOINT:}
    tenant-id: ${GOVERNANCE_SDK_TENANT_ID:}
    key-id: ${GOVERNANCE_SDK_KEY_ID:}
    base64-secret: ${GOVERNANCE_SDK_BASE64_SECRET:}

# 다운로드 링크 토큰 서명 키(DownloadTokenService). 키는 환경변수로 주입
download:
  secret:
    key: ${DRIVE_DOWNLOAD_SECRET_KEY}
  expire: 1m # 1분

sso:
  frontend-callback-path: ${DRIVE_SSO_CALLBACK_PATH:/sso/callback}

branding:
  defaults:
    tab-title: ${DRIVE_BRANDING_TAB_TITLE:Drive}
    service-name: ${DRIVE_BRANDING_SERVICE_NAME:Drive}

mfa:
  totp:
    issuer: ${DRIVE_MFA_TOTP_ISSUER:Drive}
    period: 30s
    allowed-skew-steps: 1
    digits: 6
    setup:
      pending-ttl: 30m
      clear-ttl: 40m
    login:
      challenge-token-ttl: 2m
      setup-challenge-token-ttl: 3m
      confirm-challenge-token-ttl: 3m
