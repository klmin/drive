Configuration:
  status: INFO
  Properties:
    Property:
      - name: "pattern"
        value: "%d{${LOG_DATEFORMAT_PATTERN:-yyyy-MM-dd HH:mm:ss.SSS}} %highlight{${LOG_LEVEL_PATTERN:-%5p}}{FATAL=red blink, ERROR=red, WARN=yellow bold, INFO=green, DEBUG=green bold, TRACE=blue} %style{${sys:PID}}{magenta} [%15.15t] [%X{traceId},%X{spanId}] %style{%-40.40C{1.}}{cyan} [%L] : %enc{%m}{CRLF}%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
      - name: "charset-UTF-8"
        value: "UTF-8"
      - name: "infoLogFilePathName"
        value: "${env:LOG_PATH:-/log/drive/backend/drive-server}"
      - name: "errorLogFilePathName"
        value: "${env:ERROR_LOG_PATH:-/log/drive/backend/error/drive-error}"
  Appenders:
    Console:
      name: Console
      target: SYSTEM_OUT
      follow: true
      PatternLayout:
        disableAnsi: false
        pattern: ${pattern}
    RollingFile:
      - name: InfoFile
        fileName: ${infoLogFilePathName}.log
        filePattern: ${infoLogFilePathName}-%d{yyyy-MM-dd}_%i.log
        PatternLayout:
          disableAnsi: true
          charset: ${charset-UTF-8}
          pattern: ${pattern}
        Policies:
          SizeBasedTriggeringPolicy:
            size: "200MB"
          TimeBasedTriggeringPolicy:
            interval: 1
            modulate: true
        DefaultRolloverStrategy:
          max: 10
          fileIndex: max
      - name: ErrorFile
        fileName: ${errorLogFilePathName}.log
        filePattern: ${errorLogFilePathName}-%d{yyyy-MM-dd}_%i.log
        PatternLayout:
          disableAnsi: true
          charset: ${charset-UTF-8}
          pattern: ${pattern}
        Policies:
          SizeBasedTriggeringPolicy:
            size: "200MB"
          TimeBasedTriggeringPolicy:
            interval: 1
            modulate: true
        DefaultRolloverStrategy:
          max: 10
          fileIndex: max
        Filters:
          ThresholdFilter:
            level: error
  loggers:
    root:
      level: info
      AppenderRef:
        - ref: Console
        - ref: InfoFile
        - ref: ErrorFile