spring:
  # JPA(Hibernate). DDL 은 DriveInstaller 정본(자동 생성 금지), OSIV 끔, SQL 로그는 log4j2 로.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
        timezone:
          default_storage: NORMALIZE_UTC
  datasource:
    # Testcontainers JDBC URL: 첫 접속 때 postgres:18 컨테이너를 띄우고(Docker 필요) 같은 URL 은 JVM 안에서 컨테이너를 공유한다.
    # 빈 컨테이너에 앱과 같은 Flyway 마이그레이션(classpath:db/migration, application.yml spring.flyway)이 스키마·시드를 만든다.
    url: jdbc:tc:postgresql:18:///t_drive?TC_DAEMON=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
    hikari:
      # 테스트 컨텍스트마다 풀이 따로 생기고 Spring 이 컨텍스트를 캐시해 둔다 — 공통 minimum-idle(10)을 그대로 두면
      # 컨텍스트 10개 남짓에서 공유 컨테이너의 max_connections(100)를 넘어 "too many clients" 로 컨텍스트 로딩이 실패한다.
      # 쉬는 풀은 비운다(minimum-idle 0, idle-timeout 최소값 10초). 최대치는 동시성 테스트(스레드 6개+)를 위해 10 유지.
      # 연결이 0개가 돼도 컨테이너가 내려가지 않도록 url 에 TC_DAEMON=true(없으면 빈 컨테이너가 새로 떠 스키마가 사라진다).
      maximum-pool-size: 10
      minimum-idle: 0
      idle-timeout: 10000
  sql:
    init:
      mode: never

# 스토리지 — 사내망 Ceph 대신 테스트용 RustFS 컨테이너(Docker 필요)를 쓴다.
# drive.test.s3-container.enabled 가 켜져 있으면 TestS3ContainerEnvironmentPostProcessor 가 JVM 당 컨테이너 하나를 띄우고
# 아래 endpoint·access-key·secret-key 를 그 컨테이너 값으로 덮어쓴다(여기 값은 자리표시). 버킷은 기동 때 S3BucketInitializer 가 만든다.
drive.test.s3-container.enabled: true
storage:
  type: ceph
  connection:
    endpoint: http://localhost:9000
    access-key: drive-test-access
    secret-key: drive-test-secret-key
    bucket-name: t-drive-test

S3_BUCKET_NAME : t-drive-demo
S3_REGION_STATIC : ap-northeast-2
# 아래 S3_* 는 코드에서 읽지 않는 옛 설정이다(테스트 스토리지는 위 storage.connection.* 를 RustFS 컨테이너가 덮어쓴다).
# 실제 키를 넣지 않는다 — 예전에 들어 있던 AWS 키는 git 이력에 남아 있어 교체 대상이다(docs/todo/next-session.md §3-5).
S3_ACCESS_KEY : test-access-key-placeholder
S3_SECRET_KEY : test-secret-key-placeholder

