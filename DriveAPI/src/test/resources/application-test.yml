# 공통(application.yml)은 서버 기준값이라 테스트에 맞게 되돌린다 — 통합 전(common + test)과 같은 동작 유지
logging:
  config: classpath:log/log4j2-local.yml   # 서버용은 /log/drive 에 파일을 쓴다

app:
  front:
    base-url: ""            # 테스트는 미설정(요청 host 사용)과 같게 빈 값

share:
  context-path: ""

server:
  tomcat:
    accesslog:
      enabled: false

tenant:
  cache-ttl-seconds: 0      # 테넌트 캐시 끔(통합 전 미설정 = 0)
  cache-max-size: 0

# 외부 호출 본문 로그·버퍼링 켬(프로필 제거 전 테스트 동작 유지 — 서버 기본은 false)
drive:
  rest-client:
    trace-enabled: true
  # 삭제 대기열 스케줄 끔("-") — 테스트가 tb_storage_deletion 행을 직접 확인하고, 처리는 StorageDeletionProcessor 를 직접 부른다
  scheduler:
    storage-deletion:
      cron: "-"
    upload-session-cleanup:
      cron: "-"

# 다운로드 링크 토큰 키 — 공통은 환경변수 필수라 테스트 고정값
