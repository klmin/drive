# postgres exporter 커스텀 쿼리 — 앱 코드에 없는 "지금 DB 상태" 지표(config.alloy 의 custom_queries_config_path).
# 메트릭 이름 = <최상위 키>_<컬럼>. LABEL 컬럼은 라벨, GAUGE 컬럼은 값이 된다. 수집 주기(15~30초)마다 실행되니 인덱스를 타는 가벼운 쿼리만 둔다.
# 테이블이 없는 DB(마이그레이션 전)면 이 쿼리만 실패하고 나머지 PG 지표는 그대로 나온다.

# 진행 중 업로드 세션(PENDING·COMPLETING) — idx_upload_session_cleanup(status, last_activity)
#   drive_upload_active_sessions{status}       세션 수(0 이어도 두 상태 모두 나온다)
#   drive_upload_active_reserved_bytes{status} 진행 중 용량으로 잡아 둔 크기 합
#   drive_upload_active_oldest_idle_seconds{status} 가장 오래 활동 없는 세션의 경과 시간 — TTL(1h)에 가까워지면 버려진 업로드
drive_upload_active:
  query: |
    SELECT /* exporter */ s.status,
           count(u.upload_session_id)                                      AS sessions,
           COALESCE(sum(COALESCE(u.reserve_byte, u.size_byte)), 0)         AS reserved_bytes,
           COALESCE(EXTRACT(EPOCH FROM now() - min(u.last_activity)), 0)   AS oldest_idle_seconds
    FROM (VALUES ('PENDING'), ('COMPLETING')) AS s(status)
    LEFT JOIN tb_upload_session u ON u.status = s.status
    GROUP BY s.status
  metrics:
    - status:
        usage: LABEL
        description: 업로드 세션 상태
    - sessions:
        usage: GAUGE
        description: 진행 중 업로드 세션 수
    - reserved_bytes:
        usage: GAUGE
        description: 진행 중 세션이 잡아 둔 용량(byte)
    - oldest_idle_seconds:
        usage: GAUGE
        description: 가장 오래 활동 없는 세션의 경과 시간(초)

# 잠금 대기 — 지금 다른 트랜잭션의 잠금을 기다리는 세션(이 DB 만). 쓰기 경합(같은 사용자·폴더 행)이 보이는 곳
#   drive_pg_lock_wait_sessions        잠금을 기다리는 세션 수
#   drive_pg_lock_wait_max_seconds     그중 가장 오래 기다린 시간(쿼리 시작 기준)
#   교착(deadlock) 횟수는 기본 수집기의 pg_stat_database_deadlocks
drive_pg_lock_wait:
  query: |
    SELECT /* exporter */ count(*)                                                    AS sessions,
           COALESCE(EXTRACT(EPOCH FROM max(now() - query_start)), 0)   AS max_seconds
    FROM pg_stat_activity
    WHERE wait_event_type = 'Lock' AND datname = current_database()
  metrics:
    - sessions:
        usage: GAUGE
        description: 잠금을 기다리는 세션 수
    - max_seconds:
        usage: GAUGE
        description: 가장 오래 잠금을 기다린 시간(초)

# 스토리지 정리 대기열(tb_storage_deletion) — 삭제 워커(배치 스케줄러, 30초마다)가 next_attempt_date 가 된 행을 꺼내 지운다.
# 오래 남은 행이 모두 문제는 아니다 — 교체·밀려난 이전 key 는 24시간 뒤(replaced-key-delete-delay)로, 실패한 행은 백오프(최대 60분) 뒤로 미뤄 등록된다.
# 그래서 "등록된 지 오래" 가 아니라 "지울 시각이 지났는데 안 지워짐"(기한 지남)과 "시도 상한 도달"(포기)로 본다.
#   drive_storage_deletion_pending{action}             아직 처리할 행(시도 상한 전) — 미뤄 둔 행 포함
#   drive_storage_deletion_deferred{action}            그중 지울 시각이 아직 안 된 행(유예·백오프)
#   drive_storage_deletion_overdue{action}             지울 시각이 15분 넘게 지났는데 남은 행 — 워커가 멈췄거나 밀림
#   drive_storage_deletion_overdue_max_seconds{action} 지울 시각이 지난 행 중 가장 많이 늦은 시간
#   drive_storage_deletion_exhausted{action}           시도 상한(10회)에 닿아 더 시도하지 않는 행 — 수동 확인 후 attempt_count = 0 으로 되돌리면 다시 시도
# 15분 = 워커 주기(30초) + 한 번 실행 최대 시간(4분)에 여유. 10 = StorageDeletionConstants.MAX_ATTEMPT_COUNT(바꾸면 같이)
drive_storage_deletion:
  query: |
    SELECT /* exporter */ a.action,
           count(d.storage_deletion_seq) FILTER (WHERE d.attempt_count < 10)                                                            AS pending,
           count(d.storage_deletion_seq) FILTER (WHERE d.attempt_count < 10 AND d.next_attempt_date > now())                            AS deferred,
           count(d.storage_deletion_seq) FILTER (WHERE d.attempt_count < 10 AND d.next_attempt_date < now() - interval '15 minutes')    AS overdue,
           COALESCE(EXTRACT(EPOCH FROM now() - min(d.next_attempt_date) FILTER (WHERE d.attempt_count < 10 AND d.next_attempt_date <= now())), 0) AS overdue_max_seconds,
           count(d.storage_deletion_seq) FILTER (WHERE d.attempt_count >= 10)                                                           AS exhausted
    FROM (VALUES ('DELETE'), ('ABORT_MULTIPART')) AS a(action)
    LEFT JOIN tb_storage_deletion d ON d.action = a.action
    GROUP BY a.action
  metrics:
    - action:
        usage: LABEL
        description: 정리 동작
    - pending:
        usage: GAUGE
        description: 아직 처리할 행 수(시도 상한 전, 미뤄 둔 행 포함)
    - deferred:
        usage: GAUGE
        description: 지울 시각이 아직 안 된 행 수(유예·백오프)
    - overdue:
        usage: GAUGE
        description: 지울 시각이 15분 넘게 지났는데 남은 행 수
    - overdue_max_seconds:
        usage: GAUGE
        description: 지울 시각이 지난 행 중 가장 많이 늦은 시간(초)
    - exhausted:
        usage: GAUGE
        description: 시도 상한에 닿아 더 시도하지 않는 행 수
