# Grafana 알림 규칙 — 파일로 관리(화면에서는 수정 불가, 고치려면 이 파일을 고치고 Grafana 재시작).
# 받는 곳(contact point)은 기본값(이메일, SMTP 미설정)이라 아직 아무 데도 안 간다 —
#   Grafana › Alerting › Contact points 에서 Slack·메일 등을 만들고 Notification policies 의 기본 정책에 연결한다.
# 각 규칙: A = Prometheus 쿼리(현재 값), C = 임계값 비교. for = 그 상태가 이만큼 계속돼야 발생.
apiVersion: 1

groups:
  - orgId: 1
    name: drive-availability
    folder: Drive
    interval: 1m
    rules:
      - uid: drive-scrape-down
        title: Drive 메트릭 수집 끊김
        condition: C
        for: 2m
        noDataState: Alerting       # 대상 자체가 사라져도 알림
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "Drive {{ $labels.instance }} 의 /actuator/prometheus 를 2분 넘게 못 가져옴 — 앱 다운 또는 관리 포트 차단"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'up{job="drive-api"}' }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: lt, params: [1] } }]

      - uid: drive-postgres-down
        title: PostgreSQL 접속 불가
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "Alloy 가 PostgreSQL 에 접속하지 못함(pg_up=0)"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'pg_up{job="postgres"}' }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: lt, params: [1] } }]

  - orgId: 1
    name: drive-performance
    folder: Drive
    interval: 1m
    rules:
      - uid: drive-5xx-ratio
        title: Drive 5xx 비율 5% 초과
        condition: C
        for: 5m
        noDataState: OK             # 요청이 없으면 정상
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "최근 5분 5xx 비율 {{ humanizePercentage $values.A.Value }} — Grafana 개요 대시보드 하단 ERROR 로그·트레이스 확인"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum(rate(http_server_requests_seconds_count{job="drive-api", status=~"5.."}[5m]))
                / sum(rate(http_server_requests_seconds_count{job="drive-api"}[5m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0.05] } }]

      - uid: drive-p95-latency
        title: Drive 응답 시간 p95 3초 초과
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "최근 5분 응답 시간 p95 {{ humanize $values.A.Value }}초 — 개요 대시보드 p95 그래프의 점에서 느린 트레이스 확인"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="drive-api"}[5m])))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [3] } }]

      # SLO — "API 요청의 99% 는 1초 안에 5xx 없이 끝난다". 평균·p95 대신 기준 안에 든 비율로 본다.
      #   파일 본문을 주고받는 요청(청크 파트·다운로드·미리보기 내용)은 크기에 따라 오래 걸리는 게 정상이라 뺀다.
      #   4xx 는 클라이언트 잘못이라 나쁜 요청으로 치지 않는다. 트래픽이 거의 없으면(초당 0.05 미만) 비율이 튀므로 평가하지 않는다.
      #   le="1.0" 구간은 application.yml management.metrics.distribution.slo 가 만든다.
      #   분자는 "or vector(0)" — 처음부터 5xx 만 나면 성공 시계열이 아예 없어 빈 값이 되고, 그러면 식 전체가 no data(=OK)로 위반을 놓친다
      #   (Actuator 수집 요청은 관측하지 않아 성공 시계열을 만들어 주지 않는다)
      - uid: drive-slo-latency
        title: "SLO: 1초 안 성공 비율 99% 미만"
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "최근 30분 API 요청 중 1초 안에 5xx 없이 끝난 비율 {{ humanizePercentage $values.A.Value }} (목표 99%) — 개요 대시보드 p95·5xx 확인"
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                (
                  (sum(rate(http_server_requests_seconds_bucket{job="drive-api", le="1.0", outcome!="SERVER_ERROR", uri!~".+/parts/.+|.+/download|.+/view"}[30m])) or vector(0))
                  / sum(rate(http_server_requests_seconds_count{job="drive-api", uri!~".+/parts/.+|.+/download|.+/view"}[30m]))
                )
                and on() (sum(rate(http_server_requests_seconds_count{job="drive-api", uri!~".+/parts/.+|.+/download|.+/view"}[30m])) > 0.05)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: lt, params: [0.99] } }]

      - uid: drive-db-pool-pending
        title: DB 커넥션 대기 발생
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} 에서 커넥션을 기다리는 요청이 5분째 있음 — 풀 크기(maximum-pool-size 50)·느린 쿼리 확인"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'sum by (instance) (hikaricp_connections_pending{job="drive-api"})' }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0] } }]

      - uid: drive-s3-pool-pending
        title: S3 커넥션 대기 발생
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} 에서 S3 연결을 기다리는 요청이 5분째 있음 — 대기 초과는 503(STORAGE_009). 풀(storage.http.max-connections)·다운로드 스트림 상한·스토리지 지연 확인"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            # 분포의 구간 최대 — SDK 가 시도 끝에만 알려 주므로 게이지가 없다(S3HttpPoolMetrics)
            model: { refId: A, instant: true, expr: 'max by (instance) (max_over_time(drive_s3_http_pending_max{job="drive-api"}[1m]))' }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0] } }]

  - orgId: 1
    name: drive-resources
    folder: Drive
    interval: 1m
    rules:
      - uid: drive-heap-pressure
        title: JVM 힙 부족(GC 후 90% 초과)
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} GC 후 남은 객체가 최대 힙의 {{ humanizePercentage $values.A.Value }} — OOM 전조"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'jvm_gc_live_data_size_bytes{job="drive-api"} / jvm_gc_max_data_size_bytes{job="drive-api"}'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0.9] } }]

      - uid: drive-host-memory
        title: 호스트 메모리 90% 초과
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }} 메모리 사용률 {{ humanizePercentage $values.A.Value }}"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: '1 - node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"}'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0.9] } }]

  # 정리 스케줄러(ShedLock 배치)가 제 할 일을 하는지 — DB 상태(alloy/pg-queries.yaml)로 본다.
  # 오래 남은 행이 모두 문제는 아니다(교체된 key 24시간 유예, 실패 백오프). "지울 시각이 지났는데 안 지워짐"·"시도 포기"·"TTL 지난 세션"만 알린다.
  - orgId: 1
    name: drive-cleanup
    folder: Drive
    interval: 1m
    rules:
      - uid: drive-storage-deletion-overdue
        title: 스토리지 정리 밀림
        condition: C
        for: 15m
        noDataState: OK             # 테이블이 없는 DB(마이그레이션 전)면 지표가 없다
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.action }} 정리 대기 행 {{ $values.A.Value }}개가 지울 시각을 15분 넘게 지남 — 삭제 워커(스케줄러) 정지·실패 확인"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'sum by (action) (drive_storage_deletion_overdue{job="postgres"})' }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0] } }]

      - uid: drive-storage-deletion-exhausted
        title: 스토리지 정리 포기 행 있음
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.action }} 정리 행 {{ $values.A.Value }}개가 시도 상한(10회)에 닿아 더 시도하지 않음 — last_error 확인 후 attempt_count = 0 으로 되돌리면 다시 시도"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'sum by (action) (drive_storage_deletion_exhausted{job="postgres"})' }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0] } }]

      - uid: drive-upload-session-stale
        title: 업로드 세션 정리 안 됨
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "PENDING 업로드 세션이 {{ humanizeDuration $values.A.Value }} 동안 활동 없음 — TTL(1시간)이 지났는데 만료 처리 안 됨, 세션 정리 스케줄러 확인"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'max(drive_upload_active_oldest_idle_seconds{job="postgres", status="PENDING"})' }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [4500] } }]   # 75분 = TTL 1시간 + 세션 정리 주기(10분) + 여유 5분

      # complete(조립·커밋)가 시간 제한(drive.upload.completing-timeout, 기본 30분)을 넘겨 정리 스케줄러가 실패 처리했다.
      # 정상이면 생기지 않는다 — 조립이 너무 오래 걸림(큰 파일·느린 스토리지), complete 처리 중 서버 재시작, 커밋 결과 불명확.
      # 사용자는 410 을 받고 처음부터 다시 올려야 한다. 반복되면 1GB 이상 조립 시간을 재서 시간 제한을 다시 정한다.
      - uid: drive-upload-completing-timeout
        title: 업로드 완료 처리 시간 초과
        condition: C
        for: 0s
        noDataState: OK             # 앱 지표가 없으면(수집 끊김) drive-scrape-down 이 알린다
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "최근 15분 동안 업로드 {{ $values.A.Value }}건이 완료 처리(COMPLETING) 시간 제한을 넘겨 실패 처리됨 — 조립 시간·스토리지 지연·서버 재시작 확인"
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                sum(increase(drive_upload_session_ended_total{job="drive-api", result="failed", reason="completing_timeout"}[15m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0.5] } }]   # increase 는 보간값이라 1 이 조금 덜 나올 수 있다

      # 시간 제한을 넘긴 COMPLETING 이 그대로 남아 있다 — 정리 스케줄러가 돌지 않음(위 알림도 오지 않는다)
      - uid: drive-upload-completing-stale
        title: 업로드 완료 처리 정리 안 됨
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "COMPLETING 업로드 세션이 complete 시작 뒤 {{ humanizeDuration $values.A.Value }} 지남 — 시간 제한(30분)이 지났는데 정리 안 됨, 세션 정리 스케줄러 확인"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { refId: A, instant: true, expr: 'max(drive_upload_active_oldest_completing_seconds{job="postgres", status="COMPLETING"})' }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [2700] } }]   # 45분 = 시간 제한 30분 + 세션 정리 주기(10분) + 여유 5분
