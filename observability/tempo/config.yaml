# Tempo 단일 실행 — 저장은 컨테이너 안 /var/tempo(도커 볼륨 tempo-data).
# 별도 DB 없이 traceId 기준 블록 파일로 저장한다. S3 로 옮기려면 storage.trace.backend 를 s3 로 바꾼다.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

# Alloy 가 OTLP 로 보내는 트레이스 수신
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 336h   # 14일

# 트레이스로 만든 메트릭(서비스 그래프·구간별 요청 수/지연) → Prometheus
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      # span-metrics(traces_spanmetrics_*)는 끈다 — Alloy tail 샘플링 뒤의 트레이스(정상 요청 10% + 에러·느린 요청)로 세어 요청 수·지연이 치우친다.
      #   요청 수·응답 시간은 Micrometer(http_server_requests_*)를 본다. 서비스 그래프는 모양(누가 누구를 부르나)만 보는 용도로 남기고,
      #   local-blocks 는 TraceQL 메트릭 쿼리·Grafana Traces Drilldown 용
      processors: [service-graphs, local-blocks]
