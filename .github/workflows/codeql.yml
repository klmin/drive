# CodeQL 정적 분석 (SQLi, path traversal, SSRF 등 데이터 흐름 기반 취약점)
# 결과는 Security 탭 > Code scanning 에 쌓이고, PR 에는 새로 생긴 경고만 코멘트된다.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * 0' # 매주 월요일 03:00 KST: 새 쿼리·규칙으로 main 재분석

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # 백엔드: jOOQ 생성 코드가 커밋돼 있어 DB 없이 컴파일된다.
          - language: java-kotlin
            build-mode: manual
          # 프론트엔드: 빌드 불필요
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: DriveAPI/pom.xml

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            paths-ignore:
              - DriveAPI/src/main/jooq
              - DriveAPI/governance-sdk
              - DriveFront/public
              - '**/node_modules'

      - name: Build DriveAPI
        if: matrix.language == 'java-kotlin'
        working-directory: DriveAPI
        run: |
          chmod +x mvnw
          ./mvnw -B -q -DskipTests compile

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
