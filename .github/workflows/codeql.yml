# CodeQL 정적 분석 (SQLi, path traversal, SSRF 등 데이터 흐름 기반 취약점)
#
# 저장소가 private 이라 Code scanning(Security 탭) 업로드는 유료 기능(GitHub Code Security)이다 — 업로드하면 거부돼 체크가 실패한다.
# 그래서 분석만 하고 결과는 업로드하지 않는다(upload: never):
#   - 결과 = 이 실행의 Summary 화면(발견 목록) + 아티팩트 codeql-sarif-<언어>(SARIF 원본)
#   - 안 되는 것 = Security 탭 경고 목록, PR 코드 줄 경고 표시, "이번 PR 에서 새로 생긴 경고만" 구분, 오탐으로 닫기
#   - 발견이 1건이라도 있으면 체크를 실패시킨다(FAIL_ON_FINDINGS). 기존 발견은 2026-11-20 검토로 0건 — 고치거나(로그 줄바꿈 정리 등)
#     아래 query-filters 에 이유와 함께 뺐다. 오탐을 닫는 기능이 없으므로 새 오탐은 코드로 피하거나 규칙 제외에 이유를 남긴다
# public 으로 돌리거나 유료 기능을 켜면: analyze 의 upload·output 두 줄과 아래 두 단계를 지우고 security-events: write 권한을 다시 넣는다.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * 0' # 매주 월요일 03:00 KST: 새 쿼리·규칙으로 main 재분석

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      FAIL_ON_FINDINGS: 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # 백엔드: jOOQ 생성 코드가 커밋돼 있어 DB 없이 컴파일된다.
          - language: java-kotlin
            build-mode: manual
          # 프론트엔드: 빌드 불필요
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: DriveAPI/pom.xml

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            paths-ignore:
              - DriveAPI/src/main/jooq
              - DriveAPI/governance-sdk
              - DriveFront/public
              - '**/node_modules'
            query-filters:
              # CSRF 보호를 끈 체인 3곳(내부 /api/**, 외부 /api/public/**, /mcp) — 오탐.
              #   내부: 로그인 쿠키는 커스텀 헤더 X-Drive-Role 이 있을 때만 읽는다(JwtAuthenticationFilter·AuthCookieManager.resolveCookieRole).
              #         다른 사이트의 폼은 헤더를 붙일 수 없고, 헤더를 붙인 교차 출처 요청은 CORS 사전 요청(허용 출처 목록)에서 막힌다.
              #         쿠키도 기본 SameSite=Lax. → SameSite=None 배포에서도 커스텀 헤더가 CSRF 방어를 겸한다
              #   외부(/api/public)·MCP: 쿠키가 아니라 Authorization 헤더(API Key·OAuth Bearer) — 브라우저가 자동으로 싣지 않는다
              #   쿠키 인증에 헤더 요구를 없애거나 쿠키를 읽는 다른 경로를 만들면 이 제외를 다시 검토할 것
              - exclude:
                  id: java/spring-disabled-csrf-protection

      - name: Build DriveAPI
        if: matrix.language == 'java-kotlin'
        working-directory: DriveAPI
        # .mvn/wrapper 가 커밋돼 있지 않아 mvnw 대신 runner 의 mvn 을 쓴다. 프론트는 JS 분석에서 따로 보므로 npm 빌드는 건너뛴다.
        run: mvn -B -q -DskipTests -Dfrontend.skip=true compile

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          # private 저장소 — Code scanning 업로드 없이 SARIF 파일로만 남긴다(위 설명)
          upload: never
          output: sarif-results

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize findings
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          files=(sarif-results/*.sarif)
          if [ ${#files[@]} -eq 0 ]; then
            echo "SARIF 결과 파일이 없습니다(분석 단계 실패)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          count=$(jq '[.runs[].results[]?] | length' "${files[@]}" | awk '{s+=$1} END {print s+0}')
          {
            echo "## CodeQL (${{ matrix.language }}) — 발견 ${count}건"
            echo
            echo "결과 원본: 이 실행의 아티팩트 \`codeql-sarif-${{ matrix.language }}\`"
            if [ "$count" -gt 0 ]; then
              echo
              echo "| 규칙 | 수준 | 위치 | 내용 |"
              echo "|---|---|---|---|"
              jq -r '.runs[].results[]? |
                "| \(.ruleId) | \(.level // "warning") | \(.locations[0].physicalLocation.artifactLocation.uri // "-"):\(.locations[0].physicalLocation.region.startLine // "-") | \(.message.text | gsub("\n"; " ") | gsub("\\|"; "/") | .[0:200]) |"' "${files[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "CodeQL findings: $count"
          if [ "$count" -gt 0 ] && [ "$FAIL_ON_FINDINGS" = "true" ]; then
            echo "::error::CodeQL 발견 ${count}건 — Summary 참고"
            exit 1
          fi
