# CodeQL 정적 분석 (SQLi, path traversal, SSRF 등 데이터 흐름 기반 취약점)
#
# 결과는 Code scanning(Security 탭)에 업로드한다 — 저장소가 public 이라 무료.
#   - 경고는 실행 간에 추적된다(열림/고쳐짐/닫힘). PR 은 그 PR 이 새로 만든 경고만 비교하고, 코드 줄에 주석이 달린다
#   - 실패 기준은 저장소 설정(Settings → Code security → Code scanning → Check runs failure threshold)
#   - 오탐은 Security 탭에서 경고 단위로 이유를 남겨 닫는다(Dismiss). 규칙 전체를 빼는 query-filters 는 경고 단위로 닫을 수 없는
#     반복 오탐에만 쓰고 이유를 남긴다
# 다시 private 으로 돌리면(유료 기능 없이) 업로드가 거부된다 — analyze 에 upload: never·output 을 두고 SARIF 를 아티팩트로 남기는
# 방식으로 되돌린다(git 이력 참고).
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * 0' # 매주 월요일 03:00 KST: 새 쿼리·규칙으로 main 재분석

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 백엔드: jOOQ 생성 코드가 커밋돼 있어 DB 없이 컴파일된다.
          - language: java-kotlin
            build-mode: manual
          # 프론트엔드: 빌드 불필요
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: DriveAPI/pom.xml

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            paths-ignore:
              - DriveAPI/src/main/jooq
              - DriveAPI/governance-sdk
              - DriveFront/public
              - '**/node_modules'
            query-filters:
              # CSRF 보호를 끈 체인 3곳(내부 /api/**, 외부 /api/public/**, /mcp) — 오탐.
              #   내부: 로그인 쿠키는 커스텀 헤더 X-Drive-Role 이 있을 때만 읽는다(JwtAuthenticationFilter·AuthCookieManager.resolveCookieRole).
              #         다른 사이트의 폼은 헤더를 붙일 수 없고, 헤더를 붙인 교차 출처 요청은 CORS 사전 요청(허용 출처 목록)에서 막힌다.
              #         쿠키도 기본 SameSite=Lax. → SameSite=None 배포에서도 커스텀 헤더가 CSRF 방어를 겸한다
              #   외부(/api/public)·MCP: 쿠키가 아니라 Authorization 헤더(API Key·OAuth Bearer) — 브라우저가 자동으로 싣지 않는다
              #   쿠키 인증에 헤더 요구를 없애거나 쿠키를 읽는 다른 경로를 만들면 이 제외를 다시 검토할 것
              - exclude:
                  id: java/spring-disabled-csrf-protection

      - name: Build DriveAPI
        if: matrix.language == 'java-kotlin'
        working-directory: DriveAPI
        # .mvn/wrapper 가 커밋돼 있지 않아 mvnw 대신 runner 의 mvn 을 쓴다. 프론트는 JS 분석에서 따로 보므로 npm 빌드는 건너뛴다.
        run: mvn -B -q -DskipTests -Dfrontend.skip=true compile

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
