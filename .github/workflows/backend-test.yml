# 백엔드 테스트(DriveAPI mvn test)
#
# 스프링 컨텍스트를 띄우는 테스트는 @DriveIntegrationTest(test 프로필) 로 Testcontainers PostgreSQL 을 쓴다 — 러너의 Docker 로 뜬다.
# 로컬·dev DB 에 기대던 테스트는 @Disabled(사유 포함) 로 꺼져 있고, 테스트 픽스처로 옮기면서 다시 켠다.
# 실패하면 surefire 보고서를 아티팩트(backend-test-reports)로 남긴다.
name: Backend test

on:
  pull_request:
    branches: [main]
    paths:
      - 'DriveAPI/**'
      - '.github/workflows/backend-test.yml'
  push:
    branches: [main]
    paths:
      - 'DriveAPI/**'
      - '.github/workflows/backend-test.yml'

permissions:
  contents: read

concurrency:
  group: backend-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: mvn test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: DriveAPI
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # .mvn/wrapper 가 커밋돼 있지 않아 러너의 mvn 을 쓴다. 프론트 빌드는 건너뛴다(frontend.skip).
      - name: Test
        run: mvn -B -Dfrontend.skip=true test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: DriveAPI/target/surefire-reports/
          retention-days: 7
