# 열린 PR 에 커밋이 push 될 때마다 Codex 리뷰를 요청한다("@codex review" 댓글).
# Codex 자동 리뷰는 PR 을 열 때·draft 를 ready 로 바꿀 때만 돌고 이후 push 에는 돌지 않아서, 추가 커밋이 리뷰 없이 머지되는 것을 막는다.
# - draft PR 은 건너뛴다(여러 번 push 하는 동안 리뷰가 몰리지 않게 — ready 로 바꾸면 Codex 가 스스로 리뷰한다)
# - 짧은 간격으로 여러 번 push 하면 마지막 push 에 대해서만 요청한다(concurrency)
name: Codex review on push

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Comment "@codex review"
        run: gh pr comment "$PR_NUMBER" --body "@codex review"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
