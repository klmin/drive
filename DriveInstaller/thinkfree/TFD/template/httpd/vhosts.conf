<VirtualHost *:80>
    ServerName localhost

    ProxyPreserveHost On
    ProxyRequests Off

    # 요청 본문 상한(LimitRequestBody)은 두지 않는다 — 청크 업로드 파트(기본 16MB)가 지나가야 한다. 같은 폴더 README.md

    # 백엔드 응답 대기(기본 60초) — 큰 파일 complete(스토리지에서 파트 조립)·큰 단일 요청 저장이 60초를 넘을 수 있다
    ProxyTimeout 300

    ProxyPass "/" "http://host.docker.internal:8080/"
    ProxyPassReverse "/" "http://host.docker.internal:8080/"

    ErrorLog /usr/local/apache2/logs/error.log
    CustomLog /usr/local/apache2/logs/access.log combined
</VirtualHost>
